when:
  - event: pull_request
    branch: develop

steps:
  - name: pypi-consumer
    image: ghcr.io/astral-sh/uv:0.13.7-python3.11-trixie-slim
    commands:
      - |
        set -eu

        repo_root="$PWD"
        consumer_dir="$(mktemp -d)"
        trap 'rm -rf "$consumer_dir"' EXIT

        cat > "$consumer_dir/pyproject.toml" <<'TOML'
        [project]
        name = "kuchka-consumer-smoke"
        version = "0.0.0"
        requires-python = ">=3.11"
        dependencies = ["kuchka"]

        [tool.uv]
        package = false
        TOML

        cd "$consumer_dir"

        uv sync
        uv run python -I "$repo_root/tools/consumer_smoke.py"