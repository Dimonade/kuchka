when:
  - event: pull_request
    branch: develop

steps:
  - name: wheel-consumer
    image: ghcr.io/astral-sh/uv:0.13.7-python3.11-trixie-slim
    environment:
      UV_LINK_MODE: copy
    commands:
      - |
        set -eu

        wheel_dir="$(mktemp -d)"
        trap 'rm -rf "$wheel_dir"' EXIT

        # Build the wheel from the current PR checkout.
        uv build --wheel --out-dir "$wheel_dir"

        # Ensure exactly one wheel was produced.
        set -- "$wheel_dir"/*.whl

        if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
          echo "Expected exactly one wheel in $wheel_dir" >&2
          exit 1
        fi

        # Install it into an independent consumer project.
        sh .ci/run-consumer-tests.sh wheel "$1"