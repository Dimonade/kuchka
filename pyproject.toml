[project]
name = "kuchka"
version = "0.1.0"
description = "A small pile of physically-typed engineering units for Python."
readme = "README.md"
authors = [{ name = "dimonade", email = "dimonade@protonmail.com" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://codeberg.org/dimonade/kuchka"
Repository = "https://codeberg.org/dimonade/kuchka"
"Bug Tracker" = "https://codeberg.org/dimonade/kuchka/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "coverage>=7.15.4",
  "hypothesis>=6.165.10",
  "mccabe>=0.7.0",
  "mypy>=2.3.1",
  "pylsp-mypy>=0.8.0",
  "pytest>=9.1.1",
  "python-lsp-server>=1.15.0",
  "reorder-python-imports>=3.17.0",
  "ruff>=0.16.3",
  "ty>=0.0.72",
]

[tool.coverage.run]
branch = true
source = ["kuchka"]

[tool.coverage.report]
fail_under = 85
omit = ["tests/*"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
exclude = [
  "build",
  "dist",
  ".venv",
  "venv",
  "site-packages",
  ".git",
  ".mypy_cache",
  ".tox",
  ".ruff_cache",
  "docs/introduction", # historical/narrative content quoted verbatim elsewhere (the blog post, the presentation);
  # not held to library code standards on purpose.
]
indent-width = 4
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # justfile's `just fa` already uses `ruff format` which takes care of commas.
  "CPY001", # No per-file copyright header policy for this project.
  "D105",   # Dunder methods (__add__, __eq__, ...) are documented once,
  # at the class or module level, where the physical meaning of
  # the operation actually lives; a one-line docstring repeated
  # on every operator is noise, not documentation.
  "D203",   # No blank lines after class definitions.
  "D213",   # Docstring summary on first line.
  "E402",
  "E722",
  "F403",
  "F405",
  "I001",   # Using reorder-python-imports.
  "INP001", # Okay to not have `__init__.py` when not needed.
  "N802",   # Unit constructors (Volt, Ampere, Celsius, ...) are
  # deliberately capitalized like types: `isinstance(Volt(5),
  # Voltage)` should read the way a type check reads. See
  # design_proposal.md, "Separate quantity types from unit
  # constructors".
  "EM101",  # These, together with TRY003, want every raise to route a
  "EM102",  # short message through an intermediate variable. The
  "TRY003", # exception hierarchy in errors.py exists specifically to
  # carry a full, engineering-specific explanation inline at
  # the raise site (see errors.py); routing all of those
  # through a `msg = ...` line first is boilerplate without a
  # matching benefit here.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "ANN001", # Parametrized test arguments take on whatever values the
  # parametrize table provides across cases; giving them a
  # precise static type would either be `Any` in disguise or
  # would need a broad union that adds ceremony without
  # catching anything a wrong table entry wouldn't already.
  "ANN201", # Tests usually return `None`s.
  "D100",   # Test module names are descriptive; a repeated one-line
  "D103",   # module/function docstring on every test file adds no
  # information the filename and test name did not already
  # give.
  "D104", # `tests/__init__.py` is a marker file, not a package with
  # its own public surface to document.
  "FBT003", # Tests intentionally pass literal booleans, e.g. `Volt(True)`
  # to assert that `bool` is rejected as a measurement input.
  "PLC0415", # `test_typing.py` probes for an optional dependency (mypy)
  # with an import inside a function; that is the standard
  # pattern for an optional-dependency check, not a top-level
  # import that got misplaced.
  "S101", # Asserts are okay in tests.
  "S311", # `random` is not used for cryptography.
  "S603", # Testbench is not a subject to attack.
  "S605", # Same.
  "S607", # Same.
]
"docs/examples/*/test_*.py" = [
  # Worked-example tests live outside `tests/` on purpose, so they can be
  # copied out as a standalone reference alongside their example. Same
  # reasoning as the `tests/*` ignores above, since this is the same
  # shape of code.
  "ANN001",
  "D100",
  "D103",
  "S101",
]
"docs/examples/*/demo.py" = [
  # These scripts exist to print their story to a terminal; that is the
  # entire point of running them.
  "T201",
]
