[project]
name = "kuchka"
version = "0.1.5"
description = "A small pile of strongly-typed engineering units for Python."
readme = "README.md"
keywords = [
  "units",
  "quantities",
  "dimensional-analysis",
  "physical-quantities",
  "typing",
  "exact-arithmetic",
  "engineering",
]
authors = [{ name = "dimonade", email = "dimonade@protonmail.com" }]
requires-python = ">=3.11"
dependencies = ['typing_extensions>=4.4; python_version < "3.12"']
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]

[project.urls]
Homepage = "https://github.com/Dimonade/kuchka"
Source = "https://github.com/Dimonade/kuchka"
Documentation = "https://github.com/Dimonade/kuchka/tree/HEAD/docs"
Changelog = "https://github.com/Dimonade/kuchka/blob/HEAD/CHANGELOG.md"
Issues = "https://github.com/Dimonade/kuchka/issues"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# `attrs` is imported by the tests of `kuchka.attrs`, whose own code imports nothing from it.
test = [
  "attrs>=26.1.0",
  "coverage>=7.17.3",
  "hypothesis>=6.170.8",
  "pytest>=9.1.1",
]

typing = ["mypy>=2.4.0"]

pyright = ["pyright>=1.1.414"]

# The overload generator formats what it writes with ruff, and a test runs it.
ruff = ["ruff>=0.17.2"]

lint = [
  { include-group = "ruff" },
  { include-group = "typing" },
  "mccabe>=0.7.0",
  "pylsp-mypy>=0.8.2",
  "python-lsp-server>=1.15.0",
  "ty>=0.0.91",
]

dev = [{ include-group = "test" }, { include-group = "lint" }, "tox>=4.67.1"]

[tool.coverage.run]
branch = true
source = ["kuchka"]

[tool.coverage.report]
fail_under = 85
omit = ["tests/*"]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
exclude = [
  "build",
  "dist",
  ".venv",
  "venv",
  "site-packages",
  ".git",
  ".mypy_cache",
  ".tox",
  ".ruff_cache",
]
indent-width = 4
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # justfile's `just fa` already uses `ruff format` which takes care of commas.
  "CPY001", # No per-file copyright header policy for this project.
  "D105",   # Dunder methods (__add__, __eq__, ...) are documented once, at the class or module level, where the physical meaning of
  # the operation actually lives; a one-line docstring repeated on every operator is noise, not documentation.
  "D203",   # No blank lines after class definitions.
  "D213",   # Docstring summary on first line.
  "E402",
  "E722",
  "F403",   # Star imports deliberately aggregate re-exports in units/__init__.py and
  "F405",   # Only used at module level `__init__`'s `__all__` definitions, curated by hand.
  "INP001", # Okay to not have `__init__.py` when not needed.
  "N802",   # Unit constructors (Volt, Ampere, Celsius, ...) are
  # intentionally capitalized like types: `isinstance(Volt(5), Voltage)` should read the way a type check reads.
  # See design_proposal.md, "Separate quantity types from unit constructors".
  "EM101",  # These, together with TRY003, want every raise to route a
  "EM102",  # short message through an intermediate variable. The
  "TRY003", # exception hierarchy in errors.py exists specifically to
  # carry a full, engineering-specific explanation inline at
  # the raise site (see errors.py); routing all of those
  # through a `msg = ...` line first is boilerplate without a
  # matching benefit here.
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"src/kuchka/units/__init__.py" = [
  "PLE0605",
] # Every leaf file maintains their own __all__.
"src/kuchka/units/temporal/__init__.py" = [
  "PLE0605",
] # Same: mid-level package aggregating its own family of leaf modules.
"src/kuchka/quantities/__init__.py" = ["PLE0605"] # Same.
"src/kuchka/units/archaic/**" = [
  "E501",
  "RUF001",
  "RUF002",
] # The grid tables in the docstrings are wide, and the units carry their Cyrillic, Hebrew, and Japanese names.

"tests/*" = [
  "ANN001", # Parametrized test arguments take on whatever values the parametrize table provides across cases;
  # giving them a precise static type would either be `Any` in disguise or would need a broad union that adds
  # ceremony without catching anything a wrong table entry wouldn't already.
  "ANN201", # Tests usually return `None`s.
  "D100",   # Test module names are descriptive; a repeated one-line
  "D103",   # module/function docstring on every test file adds no
  # information the filename and test name did not already give.
  "D104",    # `tests/__init__.py` is a marker file, not a package with its own public surface to document.
  "FBT003",  # Tests intentionally pass literal booleans, e.g. `Volt(True)` to assert that `bool` is rejected as a measurement input.
  "PLC0415", # `test_typing.py` probes for an optional dependency (mypy) with an import inside a function;
  # that is the standard pattern for an optional-dependency check, not a top-level import that got misplaced.
  "S101", # Asserts are okay in tests.
  "S301", # These tests pickle/unpickle values they just constructed themselves, in the same process;
  # there is no untrusted data on the other end of the `pickle.loads` call.
  "S311", # `random` is not used for cryptography.
  "S603", # Testbench is not a subject to attack.
  "S605", # Same.
  "S607", # Same.
]
"docs/examples/*/test_*.py" = [
  # Worked-example tests live outside `tests/` on purpose, so they can be copied out as a standalone reference alongside their example.
  # Same reasoning as the `tests/*` ignores above, since this is the same shape of code.
  "ANN001",
  "D100",
  "D103",
  "S101",
]
"docs/examples/*/demo.py" = [
  # These scripts exist to print their story to a terminal; that is the entire point of running them.
  "T201",
]
"benchmarks/*.py" = [
  # Same reasoning as demo.py above: a benchmark script's entire job is to print a results table to a terminal.
  "T201",
]
"tools/consumer_smoke.py" = ["T201"]
".ci/run_consumer_tests.py" = ["T201"]
".ci/check_artifacts.py" = ["T201"]

[tool.tox]
requires = ["tox>=4.67"]
env_list = [
  "3.11",
  "3.12",
  "3.13",
  "3.14",
  "3.15",
  "lint",
  "typing-min",
  "pyright",
]

[tool.tox.env_run_base]
description = "run the doctests and the test suite on Python {base_python}"
# `typing` brings mypy in for the test that checks the static types agree with the runtime.
dependency_groups = ["test", "typing", "ruff"]
# The checkers an environment installs, and the libraries the integrations are tested against: a test that needs one fails, and does not skip, if it is missing.
set_env = { KUCHKA_CHECKERS = "mypy", KUCHKA_LIBRARIES = "attrs" }
commands = [
  [
    "pytest",
    "-q",
    "--doctest-modules",
    "src/kuchka",
  ],
  [
    "pytest",
    "-q",
  ],
]

[tool.tox.env.lint]
description = "check the code standards: generated API, overloads and contents, ruff, mypy, and ty"
base_python = ["3.11"]
dependency_groups = ["lint"]
commands = [
  [
    "python",
    "tools/generate_api.py",
    "--check",
  ],
  [
    "python",
    "tools/generate_overloads.py",
    "--check",
  ],
  [
    "python",
    "tools/generate_toc.py",
    "--check",
  ],
  [
    "ruff",
    "check",
  ],
  [
    "ruff",
    "format",
    "--check",
  ],
  [
    "mypy",
    "--strict",
    "--python-version",
    "3.11",
    "src/kuchka",
  ],
  [
    "ty",
    "check",
    "src/kuchka",
  ],
]

[tool.tox.env.typing-min]
description = "type-check the library and the consumer-side types on the oldest supported mypy"
base_python = ["3.11"]
dependency_groups = ["test"]
# The floor of the type-checker policy in `README.md`: the oldest mypy that checks the library's own source cleanly.
deps = ["mypy==1.11.2"]
set_env = { KUCHKA_CHECKERS = "mypy", KUCHKA_LIBRARIES = "attrs" }
commands = [
  [
    "mypy",
    "--strict",
    "--python-version",
    "3.11",
    "src/kuchka",
  ],
  [
    "pytest",
    "-q",
    "tests/api/test_typing.py",
    "tests/contract/test_static_types_agree_with_runtime.py",
  ],
]

[tool.tox.env.pyright]
description = "check the consumer-side types on pyright"
base_python = ["3.11"]
dependency_groups = ["test", "pyright"]
set_env = { KUCHKA_CHECKERS = "pyright", KUCHKA_LIBRARIES = "attrs" }
commands = [
  [
    "pytest",
    "-q",
    "tests/api/test_typing.py",
    "tests/contract/test_static_types_agree_with_runtime.py",
  ],
]

[tool.ty.rules]
all = "warn"
