name: Bug report
description: Something behaves differently from what the documentation says, or raises an unexpected error.
labels: ["type/bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows it, with the full traceback if there is one.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kuchka version
      description: '`python -c "from importlib.metadata import version; print(version(''kuchka''))"`'
      placeholder: "0.1.5"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: "CPython 3.13 on Linux"
    validations:
      required: true
  - type: textarea
    id: checker
    attributes:
      label: Type checker output
      description: Only for a typing problem. Name the checker and its version.
      render: text
