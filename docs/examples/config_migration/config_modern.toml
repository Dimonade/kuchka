# Device limits configuration -- modern format.
#
# Every measurement is one string: a number and its unit.
# `parse` reads the digits you typed exactly, and reads the unit through the table of
# the physical quantity the field expects, so a unit that belongs to some other
# quantity is rejected, and so is a bare number with no unit.

[red_led.accepted_voltage]
min = "-1.000 mV"
max = "1.000 mV"

[red_led.accepted_current]
min = "0.000 mA"
max = "20.000 mA"

[red_led.accepted_temperature]
min = "15.0 C"
max = "45.0 C"

[blue_led.accepted_voltage]
min = "0.000 V"
max = "3.300 V"

[blue_led.accepted_current]
min = "0.000 A"
max = "0.050 A"

[blue_led.accepted_temperature]
min = "288.15 K"
max = "318.15 K"

[comms]
uart_baud_rate = "9600 Bd"
sensor_poll_rate = "500 Hz"
