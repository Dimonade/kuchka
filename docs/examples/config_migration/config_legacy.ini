; Device limits configuration -- legacy format.
;
; Units are encoded in the key name, by convention, because the parser
; that reads this file has no way to express "this number is a voltage".
;
; Nothing stops an engineer from writing a millivolt value into a key
; named _v, or copy-pasting a limit from one LED to another without
; updating the suffix.
;
; See migrate.py and README.md for the migration.

[red_led]
accepted_voltage_min_mv = -1.000
accepted_voltage_max_mv = 1.000
accepted_current_min_ma = 0.000
accepted_current_max_ma = 20.000
accepted_temperature_min_c = 15.0
accepted_temperature_max_c = 45.0

[blue_led]
accepted_voltage_min_v = 0.000
accepted_voltage_max_v = 3.300
accepted_current_min_a = 0.000
accepted_current_max_a = 0.050
accepted_temperature_min_k = 288.15
accepted_temperature_max_k = 318.15

[comms]
uart_baud_rate_bd = 9600
sensor_poll_rate_hz = 500
